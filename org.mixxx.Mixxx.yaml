app-id: io.github.cr7pt0gr4ph7.Mixxx
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
command: mixxx
rename-icon: mixxx
rename-desktop-file: org.mixxx.Mixxx.desktop
rename-appdata-file: org.mixxx.Mixxx.metainfo.xml
finish-args:
  # Wayland is used by default
  - --socket=wayland
  - --socket=fallback-x11

  # PulseAudio is needed for ALSA device access
  - --socket=pulseaudio

  # Required for DJ controller support
  - --device=all

  # Used by X11 and MusicBrainz metadata lookups
  - --share=network
  - --share=ipc

  # Permit PipeWire and user music directory access
  - --filesystem=xdg-run/pipewire-0
  - --filesystem=xdg-music

  # Hack to make removable drives available in the library GUI
  # https://github.com/flatpak/flatpak/issues/2713#issuecomment-1958510347
  - --filesystem=/media
  - --filesystem=/run/media

  # Talk to UPower and RTKit services on the system bus
  - --system-talk-name=org.freedesktop.UPower
  - --system-talk-name=org.freedesktop.RealtimeKit1

  # Talk to ScreenSaver service on the session bus
  - --talk-name=org.freedesktop.ScreenSaver

  # Ignore ALSA configuration
  - --env=ALSA_CONFIG_PATH=

  # Migrate host dconf settings
  - --metadata=X-DConf=migrate-path=/org/mixxx/Mixxx

  # App data storage in org.mixxx.Mixxx/.mixxx
  - --persist=.mixxx

add-extensions:
  # Linux audio plugins base extension
  org.freedesktop.LinuxAudio.Plugins:
    directory: extensions/Plugins
    version: "25.08"
    add-ld-path: lib
    merge-dirs: lv2
    subdirectories: true
    no-autodownload: true
cleanup:
  - "*.a"
  - "*.la"
modules:
  - modules/libmad.yaml
  - modules/lv2.yaml
  - modules/serd.yaml
  - modules/zix.yaml
  - modules/sord.yaml
  - modules/sratom.yaml
  - modules/lilv.yaml
  - modules/googletest.yaml
  - modules/benchmark.yaml
  - modules/gsl.yaml
  - modules/protobuf.yaml
  - modules/portaudio.yaml
  - modules/portmidi.yaml
  - modules/hidapi.yaml
  - modules/chromaprint.yaml
  - modules/rubberband.yaml
  - modules/soundtouch.yaml
  - modules/libid3tag.yaml
  - modules/upower.yaml
  - modules/fdk-aac-free.yaml
  - modules/libmodplug.yaml
  - modules/qtkeychain.yaml
  - modules/libebur128.yaml
  - modules/libkeyfinder.yaml
  - modules/libdjinterop.yaml
  - name: mixxx
    buildsystem: cmake-ninja
    run-tests: true
    build-options:
      env:
        GTEST_COLOR: "1"
        CTEST_OUTPUT_ON_FAILURE: "1"
        CTEST_PARALLEL_LEVEL: "1"
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DINSTALL_USER_UDEV_RULES=OFF
      - -DBUILD_BENCH=OFF
      - -DBUILD_TESTING=ON
    sources:
      - type: git
        url: https://github.com/cr7pt0gr4ph7/mixxx.git
        branch: staging
      - type: file
        path: org.mixxx.Mixxx.metainfo.xml
      - commands:
          - export LV2_PATH=$HOME/.lv2:/app/extensions/Plugins/lv2:/app/lib/lv2
          - exec mixxx.bin "$@"
        type: script
        dest-filename: mixxx.sh
    cleanup:
      - /share/icons/hicolor/scalable/apps/mixxx_ios.svg
      - /share/icons/hicolor/scalable/apps/mixxx_macos.svg
    post-install:
      - desktop-file-edit --set-key="Name" --set-value="Mixxx (Dev)" ${FLATPAK_DEST}/share/applications/org.mixxx.Mixxx.desktop
      - desktop-file-edit --set-key="Exec" --set-value="mixxx %U" ${FLATPAK_DEST}/share/applications/org.mixxx.Mixxx.desktop
      - mv ${FLATPAK_DEST}/bin/mixxx ${FLATPAK_DEST}/bin/mixxx.bin
      - install -Dm755 mixxx.sh ${FLATPAK_DEST}/bin/mixxx
      - install -d /app/extensions/Plugins
