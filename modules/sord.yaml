name: sord
buildsystem: meson
build-options:
  prepend-pkg-config-path: /app/lib64/pkgconfig
config-opts:
  - -Dbuildtype=debugoptimized
  - -Ddocs=disabled
  - -Dman=disabled
  - -Dtests=disabled
  - -Dtools=disabled
sources:
  - type: archive
    url: https://gitlab.com/drobilla/sord/-/archive/v0.16.22/sord-v0.16.22.tar.gz
    sha256: 040fb3f369dd49a7717eb28ca0a66766352e25e760729903fc8a01e117122901
    x-checker-data:
      type: anitya
      project-id: 230536
      stable-only: true
      url-template: https://gitlab.com/drobilla/sord/-/archive/v$version/sord-v$version.tar.gz
cleanup:
  - /include
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t $FLATPAK_DEST/share/licenses/sord ../COPYING
