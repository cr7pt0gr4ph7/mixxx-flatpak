name: gsl
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DGSL_TEST=OFF
sources:
  - type: archive
    url: https://github.com/microsoft/GSL/archive/refs/tags/v5.0.1.tar.gz
    sha256: 733a87a7eea56db075ee060735ba7616a27c1c55955f264d5473bf9e83294ad0
    x-checker-data:
      type: anitya
      project-id: 230453
      stable-only: true
      url-template: https://github.com/microsoft/GSL/archive/refs/tags/v$version.tar.gz
cleanup:
  - /include
  - /share/cmake
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/gsl LICENSE
