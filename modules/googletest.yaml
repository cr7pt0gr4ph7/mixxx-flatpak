name: googletest
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
sources:
  - type: archive
    url: https://github.com/google/googletest/archive/refs/tags/v1.18.0.tar.gz
    sha256: 6e3191c1455468b3fc35a417fb565c1c5071aee1b7e7f85e30cf48a98d37d8b5
    x-checker-data:
      type: anitya
      project-id: 18290
      stable-only: true
      url-template: https://github.com/google/googletest/archive/refs/tags/v$version.tar.gz
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/googletest LICENSE
