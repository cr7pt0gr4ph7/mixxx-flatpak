name: sratom
buildsystem: meson
build-options:
  prepend-pkg-config-path: /app/lib64/pkgconfig
config-opts:
  - -Dbuildtype=debugoptimized
  - -Ddocs=disabled
  - -Dtests=disabled
sources:
  - type: archive
    url: https://gitlab.com/lv2/sratom/-/archive/v0.6.22/sratom-v0.6.22.tar.gz
    sha256: 4a88bde345370584b279895c2cb8f7f8341d2b31b6ca50e128faea02f02d3e76
    x-checker-data:
      type: anitya
      project-id: 14903
      stable-only: true
      url-template: https://gitlab.com/lv2/sratom/-/archive/v$version/sratom-v$version.tar.gz
cleanup:
  - /include
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t $FLATPAK_DEST/share/licenses/sratom ../COPYING
