name: libid3tag
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
sources:
  - type: archive
    url: https://codeberg.org/tenacityteam/libid3tag/archive/0.16.4.tar.gz
    sha256: 2e9058af51e5f3881c13c55a9790abb9870812cc0f5917b6f3e825c6ae9b9f39
    x-checker-data:
      type: anitya
      project-id: 21478
      stable-only: true
      url-template: https://codeberg.org/tenacityteam/libid3tag/archive/$version.tar.gz
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/libid3tag COPYING
