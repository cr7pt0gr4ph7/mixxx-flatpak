name: qtkeychain
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DBUILD_WITH_QT6=ON
  - -DBUILD_TRANSLATIONS=OFF
sources:
  - type: archive
    url: https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/0.17.0.tar.gz
    sha256: 3b85c3929034b0a99da777130c34d99f006fcd3a9d56564159399a33fee0e504
    x-checker-data:
      type: anitya
      project-id: 381807
      stable-only: true
      url-template: https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/$version.tar.gz
cleanup:
  - /include
  - /lib/cmake
  - /mkspecs
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/qtkeychain COPYING
