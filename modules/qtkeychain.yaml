name: qtkeychain
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DBUILD_WITH_QT6=ON
  - -DBUILD_TRANSLATIONS=OFF
sources:
  - type: archive
    url: https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/0.18.0.tar.gz
    sha256: 837af59f2b950760a73eff81ccae817f7d3051183b447438dc610bb984a41691
    x-checker-data:
      type: anitya
      project-id: 381807
      stable-only: true
      url-template: https://github.com/frankosterfeld/qtkeychain/archive/refs/tags/$version.tar.gz
cleanup:
  - /include
  - /lib/cmake
  - /mkspecs
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/qtkeychain COPYING
