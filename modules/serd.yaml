name: serd
buildsystem: meson
config-opts:
  - -Dbuildtype=debugoptimized
  - -Ddocs=disabled
  - -Dman=disabled
  - -Dtests=disabled
  - -Dtools=disabled
sources:
  - type: archive
    url: https://gitlab.com/drobilla/serd/-/archive/v0.32.10/serd-v0.32.10.tar.gz
    sha256: d17b99ef250e4dffcdd08c8eaad2459a1519c1ff2553fa91176ce71ac0dd0739
    x-checker-data:
      type: anitya
      project-id: 230531
      stable-only: true
      url-template: https://gitlab.com/drobilla/serd/-/archive/v$version/serd-v$version.tar.gz
cleanup:
  - /include
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t $FLATPAK_DEST/share/licenses/serd ../COPYING
