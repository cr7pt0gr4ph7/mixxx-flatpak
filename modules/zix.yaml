name: zix
buildsystem: meson
config-opts:
  - -Dbuildtype=debugoptimized
  - -Dbenchmarks=disabled
  - -Ddocs=disabled
  - -Dtests=disabled
  - -Dtests_cpp=disabled
sources:
  - type: archive
    url: https://gitlab.com/drobilla/zix/-/archive/v0.8.2/zix-v0.8.2.tar.gz
    sha256: a2464cdc11fa359b5e713b3c82bf0b476952efe397a02374ddbc1b62eee04f13
    x-checker-data:
      type: anitya
      project-id: 370005
      stable-only: true
      url-template: https://gitlab.com/drobilla/zix/-/archive/v$version/zix-v$version.tar.gz
cleanup:
  - /include
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t $FLATPAK_DEST/share/licenses/zix ../COPYING
