name: hidapi
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
sources:
  - type: archive
    url: https://github.com/libusb/hidapi/archive/refs/tags/hidapi-0.16.0.tar.gz
    sha256: bc599d295792fe515778f19ce86a49760b0ea5fc114e5258245d470609632bbf
    x-checker-data:
      type: anitya
      project-id: 5594
      stable-only: true
      url-template: https://github.com/libusb/hidapi/archive/refs/tags/hidapi-$version.tar.gz
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/hidapi LICENSE-gpl3.txt LICENSE.txt
