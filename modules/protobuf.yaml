name: protobuf
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -Dprotobuf_BUILD_TESTS=OFF
sources:
  - type: archive
    url: https://github.com/protocolbuffers/protobuf/archive/refs/tags/v36.2.tar.gz
    sha256: 7e7eaf580ec77f1a392ff1ab1013c13d3b04a6716f002f697f67f3c1113f0530
    x-checker-data:
      type: anitya
      project-id: 3715
      stable-only: true
      url-template: https://github.com/protocolbuffers/protobuf/archive/refs/tags/v$version.tar.gz
cleanup:
  - /bin
  - /include
  - /lib/cmake
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/protobuf LICENSE
