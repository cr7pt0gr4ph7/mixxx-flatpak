name: portmidi
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
sources:
  - type: archive
    url: https://github.com/PortMidi/portmidi/archive/refs/tags/v2.0.8.tar.gz
    sha256: f21201d4cc233638d7bb6ee29ee6dece54f6c9c1aeb7989bc978001caaf2f666
    x-checker-data:
      type: anitya
      project-id: 10595
      stable-only: true
      url-template: https://github.com/PortMidi/portmidi/archive/refs/tags/v$version.tar.gz
cleanup:
  - /bin
  - /include
  - /lib/cmake
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/portmidi license.txt
