name: chromaprint
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DBUILD_TESTS=OFF
sources:
  - type: archive
    url: https://github.com/acoustid/chromaprint/archive/refs/tags/v1.6.2.tar.gz
    sha256: 7f92ea1141429b43f695a1ba56d5058132f89fae5f137ce705afc57734f6b5fa
    x-checker-data:
      type: anitya
      project-id: 286
      stable-only: true
      url-template: https://github.com/acoustid/chromaprint/archive/refs/tags/v$version.tar.gz
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/chromaprint LICENSE.md
