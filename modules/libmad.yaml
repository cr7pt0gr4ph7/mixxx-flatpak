name: libmad
buildsystem: cmake-ninja
config-opts:
  - -DCMAKE_BUILD_TYPE=RelWithDebInfo
  - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
sources:
  - type: archive
    url: https://codeberg.org/tenacityteam/libmad/archive/0.16.5.tar.gz
    sha256: e32320a010e3cc00bfa66e0cde523a969313cddfd81e07ec4e3ef06d10ad3fe0
    x-checker-data:
      type: json
      url: https://codeberg.org/api/v1/repos/tenacityteam/libmad/releases/latest
      version-query: .tag_name
      url-query: .tarball_url
cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/libmad COPYING COPYRIGHT
