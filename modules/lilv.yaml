name: lilv
buildsystem: meson
build-options:
  prepend-pkg-config-path: /app/lib64/pkgconfig
config-opts:
  - -Dbuildtype=debugoptimized
  - -Dbindings_py=disabled
  - -Ddocs=disabled
  - -Dtests=disabled
  - -Dtools=disabled
sources:
  - type: archive
    url: https://gitlab.com/lv2/lilv/-/archive/v0.28.0/lilv-v0.28.0.tar.gz
    sha256: 006065dcb59ccaad5463e6bb4598160e41dd6474a959838e74820f60a849bfdb
    x-checker-data:
      type: anitya
      project-id: 1818
      stable-only: true
      url-template: https://gitlab.com/lv2/lilv/-/archive/v$version/lilv-v$version.tar.gz
cleanup:
  - /etc
  - /include
  - /lib/pkgconfig
post-install:
  - install -Dm644 -t $FLATPAK_DEST/share/licenses/lilv ../COPYING
