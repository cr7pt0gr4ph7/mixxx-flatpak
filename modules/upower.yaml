name: upower
buildsystem: meson
config-opts:
  - -Dbuildtype=debugoptimized
  - -Dman=false
  - -Dgtk-doc=false
  - -Dintrospection=disabled
  - -Dsystemdsystemunitdir=no
  - -Dudevrulesdir=/app/etc/udev/rules.d
  - -Dudevhwdbdir=/app/etc/udev/hwdb.d
  - -Dzshcompletiondir=no
sources:
  - type: archive
    url: 
      https://gitlab.freedesktop.org/upower/upower/-/archive/v1.91.5/upower-v1.91.5.tar.gz
    sha256: d900f175e39fbc0dfd8632f7c70606e10f79903ee4171d199aa777dfa3a396e2
    x-checker-data:
      type: anitya
      project-id: 5056
      stable-only: true
      url-template: 
        https://gitlab.freedesktop.org/upower/upower/-/archive/v$version/upower-v$version.tar.gz
cleanup:
  - /bin
  - /etc
  - /include
  - /libexec
  - /lib/pkgconfig
  - /share/locale
  - /share/runtime
  - /share/dbus-1
  - /var
post-install:
  - install -Dm644 -t ${FLATPAK_DEST}/share/licenses/upower ../COPYING
